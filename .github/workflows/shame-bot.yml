name: Shame Bot

# Posts shame to Discord and logs it in metrics/shame.json on this repo's
# metrics branch, under a category the team website charts. The rules are in
# shame-bot/rules.mjs, and the formats in shame-bot/README.md:
#   - behemoth: a PR over 1000 lines (not counting Swagger docs), once per PR
#   - late_night: doing anything on a PR 1am-5am Eastern, once per person per night
#   - slow_review: a requested reviewer not reviewing within 24 hours, or a
#     reviewer not re-reviewing within 24 hours of a push
#   - idle_author: the author not doing anything 48 hours after a review
#   - manual: a /shame in Discord that 2 other teammates endorsed. The team
#     website (dawn-care/Internal-Website) runs /shame and the Endorse button,
#     and sends the result here as a "manual-shame" repository_dispatch.
#
# The PRs live in WATCHED_REPO, which forwards its PR events here as a
# "pr-event" repository_dispatch (its .github/workflows/internal-tools-forwarder.yml).
# slow_review and idle_author can't be seen in any one event, so they're checked
# hourly, by reading the watched repo's open PRs (it's public, so this repo's
# own token can), and shamed again every further 24 hours.
#
# Pushes are recorded too (in metrics/shame-state.json): GitHub doesn't keep
# when a commit was pushed, which is when a re-review is owed from.
on:
  repository_dispatch:
    types: [pr-event, manual-shame]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions: {}

env:
  WATCHED_REPO: dawn-care/DAWN

jobs:
  shame:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the counts to the metrics branch
    steps:
      # repository_dispatch and schedule always run the default branch;
      # a manual run uses the branch it's run from, for testing.
      - uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: shame-bot

      - uses: actions/checkout@v4
        with:
          ref: metrics
          path: metrics-branch

      - name: Shame
        working-directory: metrics-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_DIR: ${{ github.workspace }}/metrics-branch
          # The shame channel's webhook. Not DISCORD_WEBHOOK_URL: that's the PR channel.
          DISCORD_SHAME_WEBHOOK_URL: ${{ secrets.DISCORD_SHAME_WEBHOOK_URL }}
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node "$GITHUB_WORKSPACE/tools/shame-bot/shame.mjs"
